Define APP_ROOT "/home/studs/s501851/httpd-root"
Define HTTP_PORT 24666
Define FCGI_PORT 24777
ErrorDocument 500 /empty.html
ErrorDocument 502 /empty.html
ErrorDocument 503 /empty.html
ErrorDocument 504 /empty.html

ServerRoot "/usr/local"

LoadModule headers_module libexec/apache24/mod_headers.so
LoadModule unixd_module libexec/apache24/mod_unixd.so
LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule log_config_module libexec/apache24/mod_log_config.so
LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule dir_module libexec/apache24/mod_dir.so
LoadModule alias_module libexec/apache24/mod_alias.so
LoadModule fastcgi_module libexec/apache24/mod_fastcgi.so

Listen ${HTTP_PORT}
AcceptFilter http none
ServerName localhost:${HTTP_PORT}
DefaultRuntimeDir "${APP_ROOT}/run"
Mutex "default:${APP_ROOT}/run"
PidFile "${APP_ROOT}/httpd.pid"
ErrorLog "${APP_ROOT}/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "${APP_ROOT}/access.log" common

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "${APP_ROOT}/public"
DirectoryIndex index.html
TypesConfig etc/apache24/mime.types
AddDefaultCharset UTF-8

<FilesMatch "\.(html|htm|js|css)$">
    <IfModule mod_headers.c>
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header set Pragma "no-cache"
        Header set Expires 0
    </IfModule>
</FilesMatch>

<Directory "${APP_ROOT}/public">
    Options None
    AllowOverride None
    Require all granted
</Directory>

FastCgiIpcDir "${APP_ROOT}/run"
FastCgiExternalServer "${APP_ROOT}/fcgi-bin/server.jar" -host 127.0.0.1:${FCGI_PORT} -nph
Alias /fcgi-bin/server.jar "${APP_ROOT}/fcgi-bin/server.jar"

<Directory "${APP_ROOT}/fcgi-bin">
    Options None
    AllowOverride None
    Require all granted
    <Files "server.jar">
        SetHandler fastcgi-script
    </Files>
</Directory>