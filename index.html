<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №2 – Вариант 824152</title>

    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 15px;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        #header-info {
            font-family: Arial, sans-serif;
            font-size: 18px;
            border-bottom: 2px solid #cbd5e1;
            padding: 15px 25px;
            margin-bottom: 20px;
        }

        #header-info h1 {
            font-size: 22px;
            margin: 0 0 6px;
            color: #000;
        }

        #header-info p {
            margin: 0;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 30px;
        }

        .panel-box {
            border: 1px solid #e2e8f0;
            padding: 20px;
            flex: 1 1 360px;
            min-width: 0;
        }

        .full-width {
            flex-basis: 100%;
        }

        .panel-title {
            font-size: 17px;
            font-weight: 600;
            color: #0f172a;
            margin: 0 0 15px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        select, input[type="text"] {
            box-sizing: border-box;
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            background-color: #ffffff;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #444;
        }

        .radio-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }

        .radio-label {
            cursor: pointer;
        }

        .radio-label input[type="radio"] {
            margin-right: 6px;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .button-group {
            margin-top: 20px;
        }

        button[type="submit"],
        button[type="button"] {
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid transparent;
            cursor: pointer;
        }

        button[type="submit"] {
            background-color: #2563eb;
            color: #ffffff;
        }

        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        button[type="submit"]:active {
            background-color: #1e40af;
        }

        #btn-clear {
            background-color: #f1f5f9;
            color: #475569;
            border-color: #cbd5e1;
        }

        #btn-clear:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        #error-box {
            display: none;
            background-color: #fef2f2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12px;
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        canvas {
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 500px;
            height: auto;
        }

        .table-responsive {
            overflow-x: auto;
        }

        #results-table {
            width: 100%;
            text-align: left;
            font-size: 14px;
        }

        #results-table th,
        #results-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        #results-table th {
            color: #475569;
            font-weight: 600;
        }

        #results-table th,
        #results-table tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        #results-table tbody tr:hover {
            background-color: #f1f5f9;
        }

        .status-hit, .status-miss {
            font-weight: bold;
        }

        .status-hit {
            color: #166534;
        }

        .status-miss {
            color: #991b1b;
        }

        .empty-row {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }

        #connection-error-page {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #151210;
            z-index: 1000;
        }
    </style>
</head>
<body>

<header id="header-info">
    <h1>Лабораторная работа №2</h1>
    <p><strong>Студент:</strong> Перфилов Алексей Михайлович | <strong>Группа:</strong> P3209 | <strong>Вариант:</strong> 824152</p>
</header>

<div class="main-container">

    <div class="panel-box">
        <h2 class="panel-title">Координатная область</h2>
        <div class="canvas-wrapper">
            <canvas id="area-canvas" width="500" height="500"></canvas>
        </div>
    </div>

    <div class="panel-box">
        <h2 class="panel-title">Параметры точки</h2>

        <div id="error-box"></div>

        <form id="point-form">

            <div class="form-group">
                <span id="x-label">Координата X:</span>
                <div class="radio-options" role="radiogroup" aria-labelledby="x-label">
                    <label class="radio-label"><input type="radio" name="x-val" value="-3"> -3</label>
                    <label class="radio-label"><input type="radio" name="x-val" value="-2"> -2</label>
                    <label class="radio-label"><input type="radio" name="x-val" value="-1"> -1</label>
                    <label class="radio-label"><input type="radio" name="x-val" value="0"> 0</label>
                    <label class="radio-label"><input type="radio" name="x-val" value="1"> 1</label>
                    <label class="radio-label"><input type="radio" name="x-val" value="2"> 2</label>
                    <label class="radio-label"><input type="radio" name="x-val" value="3"> 3</label>
                    <label class="radio-label"><input type="radio" name="x-val" value="4"> 4</label>
                    <label class="radio-label"><input type="radio" name="x-val" value="5"> 5</label>
                </div>
            </div>

            <div class="form-group">
                <label for="y-val">Координата Y (−3 < Y < 3):</label>
                <input type="text" id="y-val" name="y-val" placeholder="Например: 1.25 или -2,75">
            </div>

            <div class="form-group">
                <label for="r-val">Радиус R:</label>
                <select id="r-val" name="r-val">
                    <option value="1">1</option>
                    <option value="1.5">1,5</option>
                    <option value="2">2</option>
                    <option value="2.5">2,5</option>
                    <option value="3">3</option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" id="btn-submit">Проверить точку</button>
                <button type="button" id="btn-clear">Очистить историю</button>
            </div>
        </form>
    </div>

    <div class="panel-box full-width">
        <h2 class="panel-title">История проверок</h2>
        <div class="table-responsive">
            <table id="results-table">
                <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Время</th>
                    <th>Время обработки, мс</th>
                </tr>
                </thead>
                <tbody id="results-body">
                <tr id="empty-row"><td colspan="6" class="empty-row">История проверок пуста</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<iframe id="connection-error-page" src="empty.html" title="Связь с сервером потеряна" hidden></iframe>
<script src="index.js"></script>
</body>
</html>
